<html>
    <head>
        <title> Exercicio 5: apresentar os caracteres de uma string e suas posições.
        </title>

    <script>
        var frase="Ola, tudo bem?";
        document.write (frase+"<br>");
        tamanho=frase.length;
        for (var i=0; i< tamanho;)
        {
            document.write ("<br>Caractere na posicao "+i+" : "+frase. charAt (i) ) ;
            i++;
        }

        document.write("<br><br>Primeiro caractere: " + frase.charAt (0) + "<br />");
        document.write("Ultimo caractere: " + frase. charAt (frase.length-1) ) ;

        /*
        O metodo charAt () retorna o caractere da posicao especificada da string (do
        indice especificado).
        */

    </script>
    </head>
    <body>
    </body>
</html>
