<html>
    <head>
        <title> TPC 6 - SOMA</title>

        <script>
            
            let valor1=window.prompt("Introduza um valor: ");
            let valor2=window.prompt("Introduza OUTRO valor: ");

            x=eval (valor1) +eval (valor2)
            document.write("O resultado da soma de "+valor1+" e "+valor2+" e igual a "+x);
        </script>
    </head>
</html>
