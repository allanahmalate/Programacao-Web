<html>
    <head>
        <title>TPC 6 - COMPARAR</title>
        <script>
            valor=window.prompt("Introduza um valor: ");
            if(valor!=null && valor!="")
            {
                if(valor>10)
                {  
                    document.write("O valor "+valor+" é maior que 10!<br>");
                }
                if(valor<10)
                {  
                    document.write("O valor "+valor+" é menor que 10!");
                }
                else
                {  
                    document.write("O valor "+valor+" é igual a 10!");
                }
            }
            else
            {
                document.write("INTRODUZA UM VALOR!");
            }
        </script>
    </head>
</html>
