<html>
    <head>
        <title> TPC 6 - REPETIÇÃO</title>

        <script>
            nome=window.prompt("Introduza um nome: ");
            valor=window.prompt("Introduza um valor: ");
            document.write ("NOME: "+nome+"<br><br>");
            for (var i=0; i< valor;)
            {
                document.write (nome+"<br>");
                i++;
            }
        </script>
    </head>
</html>
